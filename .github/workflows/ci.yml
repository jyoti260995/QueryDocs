name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (CPU-only PyTorch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements-dev.txt

      - name: Check the app imports cleanly
        run: python -m py_compile app.py querydocs/*.py

      - name: Run tests
        run: python -m pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t querydocs .

      - name: Start container and check health endpoint
        run: |
          docker run -d --name qd -p 8501:8501 -e MISTRAL_API_KEY=dummy querydocs
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8501/_stcore/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs qd
          exit 1
